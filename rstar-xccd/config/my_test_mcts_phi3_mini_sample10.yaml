# Phi-3-mini-128k-instruct, sample10 smoke test config.
# Use with: --qaf eval_data/test_same_python_java_sample10.jsonl
# Mirrors my_test_mcts_sample10.yaml but kept separate so Phi-3-mini's
# settings (single GPU, tp=1) can diverge from the Qwen3 sample10 config
# without touching it.
mode: "mcts"
model_dir: ""

few_shot_path: "./rstar_deepthink/few_shots/few_shot_imprvoed.json"
prompt_path: "./rstar_deepthink/few_shots/mcts_prompt.json"

swap_space: 8
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.1
min_tokens: 8
errors_threshold: 2

prompt_wrap: "rstar"
result_unwrap: "rstar"
step_delim: "\n"
stop: ["<end_of_step>", "<end_of_code>", "<end_of_output>", "<end_of_answer>"]

max_depth: 12
n_generate_sample: 2
best_of: 2
is_sampling: True
iterations: 2
max_tokens: 512

need_value_func: False
batch_size: 1
num_few_shot: 2
max_model_len: 16384
c_puct: 2
terminal_sample: True

llm_gpu_memory_utilization: 0.90
tp: 1
