# Qwen2.5-Coder-3B copy of my_test_mcts_qwen2.5_7b_depth_16_2gpu_no_sampling_code2_exec_rust_v3.yaml.
# Only the checkpoint (model_dir, supplied via --model_dir) differs -- kept
# as a separate file per this repo's convention (see the 3B baseline config's
# header) so a future 7B-specific change can't silently alter 3B runs.
#
# Tests whether the v3 rust fix -- >=3 structurally different test inputs
# required before accepting an execution match as clone evidence, see the 7B
# config's header -- also recovers false positives for the smaller model, or
# whether that failure mode (and its fix) is 7B-specific.
#
# is_sampling: False -- the search must never see the ground-truth label.

mode: "mcts"
model_dir: ""

few_shot_path: "./rstar_deepthink/few_shots/few_shot_code2_exec_python_rust_v3.json"
prompt_path: "./rstar_deepthink/few_shots/mcts_prompt_code2_exec_python_rust_v3.json"

swap_space: 8
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.1
min_tokens: 8
errors_threshold: 2

prompt_wrap: "rstar"
result_unwrap: "rstar"
step_delim: "\n"
stop: ["<end_of_step>", "<end_of_code>", "<end_of_output>", "<end_of_answer>"]

max_depth: 16
n_generate_sample: 2
best_of: 2
is_sampling: False
iterations: 2
max_tokens: 512

need_value_func: False
batch_size: 1
num_few_shot: 3
max_model_len: 16384
c_puct: 2
terminal_sample: True

llm_gpu_memory_utilization: 0.90
tp: 2
