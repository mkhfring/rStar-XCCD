# Qwen3-8B, 2 GPU (tensor-parallel) config.
# Mirrors my_test_mcts_phi3_mini_2gpu.yaml; uses the plain stop-tag list since
# Qwen3 follows the <end_of_*> tag protocol reliably. Qwen3's chat template
# needs enable_thinking=False (handled in rstar_prompt_wrap, not here) to keep
# it from emitting a <think> block instead of following the rStar step format.
mode: "mcts"
model_dir: ""

few_shot_path: "./rstar_deepthink/few_shots/few_shot_imprvoed.json"
prompt_path: "./rstar_deepthink/few_shots/mcts_prompt.json"

swap_space: 8
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.1
min_tokens: 8
errors_threshold: 2

prompt_wrap: "rstar"
result_unwrap: "rstar"
step_delim: "\n"
stop: ["<end_of_step>", "<end_of_code>", "<end_of_output>", "<end_of_answer>"]

max_depth: 8
n_generate_sample: 2
best_of: 2
is_sampling: True
iterations: 2
max_tokens: 512

need_value_func: False
batch_size: 1
num_few_shot: 2
max_model_len: 16384
c_puct: 2
terminal_sample: True

llm_gpu_memory_utilization: 0.90
tp: 2
