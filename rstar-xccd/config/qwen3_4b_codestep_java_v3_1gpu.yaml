# CODE-STEP v3 (2026-10-03): = codestep_java_v2 with prompt/examples v3, tuned on the DEV hard-negative pilot:
# err(r) helper printed in every run step, rule 4 (valid inputs only), rule 5 (both fail -> fix the input;
# decide by reading only if ONE program keeps failing), example 7 (both fail -> add terminating line). reward v4.
mode: "mcts"
model_dir: ""

few_shot_path: "./rstar_deepthink/few_shots/few_shot_codestep_python_java_v3.json"
prompt_path: "./rstar_deepthink/few_shots/mcts_prompt_codestep_python_java_v3.json"

swap_space: 8
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.1
min_tokens: 8
errors_threshold: 2

prompt_wrap: "rstar"
result_unwrap: "rstar"
step_delim: "\n"
stop: ["<end_of_step>", "<end_of_code>", "<end_of_output>", "<end_of_answer>"]

max_depth: 16
n_generate_sample: 2
best_of: 2
is_sampling: False
iterations: 8
max_tokens: 512

need_value_func: False
batch_size: 1
num_few_shot: 7
max_model_len: 16384
c_puct: 2
terminal_sample: True

llm_gpu_memory_utilization: 0.90
tp: 1

rust_crate_check: "strict"

execute_code2: True
auto_code2: False
score_version: "v4"
codestep: True
positive_reward: 1.0
negative_reward: -1.0
