# CODE-STEP v2 (2026-10-03): = codestep_java_v1 with prompt/examples v2 (same() helper, rules 5-6:
# undecidable-by-execution -> decide by reading and write it into is_clone; 6 examples incl. no-input and
# broken-program clones); harness compares outputs ignoring whitespace. reward v4, 8 rollouts.
mode: "mcts"
model_dir: ""

few_shot_path: "./rstar_deepthink/few_shots/few_shot_codestep_python_java_v2.json"
prompt_path: "./rstar_deepthink/few_shots/mcts_prompt_codestep_python_java_v2.json"

swap_space: 8
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.1
min_tokens: 8
errors_threshold: 2

prompt_wrap: "rstar"
result_unwrap: "rstar"
step_delim: "\n"
stop: ["<end_of_step>", "<end_of_code>", "<end_of_output>", "<end_of_answer>"]

max_depth: 16
n_generate_sample: 2
best_of: 2
is_sampling: False
iterations: 8
max_tokens: 512

need_value_func: False
batch_size: 1
num_few_shot: 6
max_model_len: 16384
c_puct: 2
terminal_sample: True

llm_gpu_memory_utilization: 0.90
tp: 1

rust_crate_check: "strict"

execute_code2: True
auto_code2: False
score_version: "v4"
codestep: True
positive_reward: 1.0
negative_reward: -1.0
