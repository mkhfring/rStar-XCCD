# Qwen3-4B, 2 GPU (tensor-parallel) config.
# Copy of my_test_mcts_qwen3_4b_depth_16_2gpu_no_sampling.yaml with
# n_generate_sample/best_of raised from 2 to 4 (more samples generated per
# MCTS step/node), per explicit request. Kept as its own file rather than
# editing the depth_16 no_sampling config in place, since that one is still
# referenced by the n=2 CLCCD jobs already submitted/run under this branch.

mode: "mcts"
model_dir: ""

few_shot_path: "./rstar_deepthink/few_shots/few_shot_imprvoed.json"
prompt_path: "./rstar_deepthink/few_shots/mcts_prompt.json"

swap_space: 8
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.1
min_tokens: 8
errors_threshold: 2

prompt_wrap: "rstar"
result_unwrap: "rstar"
step_delim: "\n"
stop: ["<end_of_step>", "<end_of_code>", "<end_of_output>", "<end_of_answer>"]

max_depth: 16
n_generate_sample: 4
best_of: 4
is_sampling: False
iterations: 2
max_tokens: 512

need_value_func: False
batch_size: 1
num_few_shot: 2
max_model_len: 16384
c_puct: 2
terminal_sample: True

llm_gpu_memory_utilization: 0.90
tp: 2
