# Offline crate set for Code 2 (Rust) in the code-step harness -- training plan Phase 0.2.
# Versions = AtCoder's 2020 language update (the era of the CodeNet Rust submissions).
# Built once on a login node (network) by build.sh into $RUST_CRATES_DIR; compute nodes only link.
[package]
name = "codestep_crates"
version = "0.1.0"
edition = "2018"

[dependencies]
proconio = { version = "=0.3.6", features = ["derive"] }
itertools = "=0.9.0"
itertools-num = "=0.1.3"
num = "=0.2.1"
num-traits = "=0.2.12"
num-integer = "=0.1.43"
num-bigint = "=0.2.6"
num-rational = "=0.2.4"
num-complex = "=0.2.4"
alga = "=0.9.3"
text_io = "=0.1.8"
superslice = "=1.0.0"
ascii = "=1.0.0"
permutohedron = "=0.2.4"
im-rc = "=14.3.0"
petgraph = "=0.5.1"
ordered-float = "=2.0.0"
whiteread = "=0.5.0"
rand = { version = "=0.7.3", features = ["small_rng"] }
regex = "=1.3.6"
lazy_static = "=1.4.0"
bitset-fixed = "=0.1.0"
rustc-hash = "=1.1.0"
smallvec = "=1.2.0"
maplit = "=1.0.2"
either = "=1.5.3"
fixedbitset = "=0.2.0"
indexmap = "=1.3.2"

[profile.release]
opt-level = 3
